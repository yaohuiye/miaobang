name: Rules and compatibility tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test local rules
        working-directory: app
        run: node --test --test-reporter=spec tests/*.test.mjs
